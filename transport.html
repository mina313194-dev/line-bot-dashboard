<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清運分析</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f7; color: #1d1d1f; }
  .header { background: #fff; padding: 16px 20px; border-bottom: 1px solid #e5e5e5; position: sticky; top: 0; z-index: 10; }
  .header h1 { font-size: 17px; font-weight: 600; }
  .header p { font-size: 12px; color: #888; margin-top: 2px; }
  .month-tabs { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; background: #fff; border-bottom: 1px solid #e5e5e5; }
  .tab { padding: 6px 14px; border-radius: 20px; font-size: 13px; border: 1px solid #ddd; background: #fff; cursor: pointer; white-space: nowrap; }
  .tab.active { background: #1d1d1f; color: #fff; border-color: #1d1d1f; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 14px 16px; }
  .stat { background: #fff; border-radius: 12px; padding: 14px 10px; text-align: center; }
  .stat-num { font-size: 18px; font-weight: 600; }
  .stat-lbl { font-size: 11px; color: #888; margin-top: 3px; }
  .up { color: #e5383b; } .down { color: #2d9c56; }
  .section { background: #fff; margin: 0 16px 12px; border-radius: 12px; padding: 16px; }
  .section h2 { font-size: 14px; font-weight: 600; margin-bottom: 14px; color: #333; }
  .chart-wrap { position: relative; height: 220px; }
  .chart-wrap.tall { height: 260px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .bar-label { font-size: 12px; color: #555; width: 80px; text-align: right; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { flex: 1; background: #f0f0f0; border-radius: 6px; height: 22px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; display: flex; align-items: center; padding-left: 8px; font-size: 11px; color: #fff; font-weight: 500; }
  .rank-badge { width: 22px; height: 22px; border-radius: 50%; background: #eee; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; }
  .rank-badge.gold { background: #f6c90e; color: #7a5f00; }
  .rank-badge.silver { background: #d0d0d0; color: #555; }
  .rank-badge.bronze { background: #e8b084; color: #6b3e1f; }
  .vehicle-row { display: flex; gap: 12px; }
  .vehicle-card { flex: 1; background: #f7f7f7; border-radius: 10px; padding: 12px; text-align: center; }
  .vehicle-num { font-size: 22px; font-weight: 600; }
  .vehicle-lbl { font-size: 11px; color: #888; margin-top: 3px; }
  .vehicle-amt { font-size: 13px; color: #555; margin-top: 4px; }
  .compare-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
  .compare-item:last-child { border-bottom: none; }
  .loading { text-align: center; padding: 60px 20px; color: #888; font-size: 14px; }
  .error { text-align: center; padding: 40px 20px; color: #e5383b; font-size: 13px; line-height: 1.8; }
</style>
</head>
<body>
<div class="header">
  <h1>🚛 清運業務分析</h1>
  <p id="update-time">載入中...</p>
</div>
<div class="month-tabs" id="month-tabs"></div>
<div id="main-content"><div class="loading">⏳ 資料載入中...</div></div>

<script>
const TRANSPORT_SHEET_ID = "1-nQoAo9gigL99qA2sCJwD5F3fd92nRT5tPjWdAkH46M";
const COLORS = ["#5DCAA5","#7F77DD","#EF9F27","#D85A30","#378ADD","#D4537E","#639922","#BA7517","#4ECDC4","#FF6B6B"];
const START_MONTH = 3;

let allData = {}, months = [], currentMonth = 0;

function csvParse(text) {
  const rows = [];
  for (const line of text.split("\n")) {
    if (!line.trim()) continue;
    const cols = []; let cur = "", inQ = false;
    for (const ch of line) {
      if (ch==='"') { inQ=!inQ; continue; }
      if (ch===','&&!inQ) { cols.push(cur.trim()); cur=""; continue; }
      cur += ch;
    }
    cols.push(cur.trim());
    rows.push(cols);
  }
  return rows;
}

async function loadMonth(m) {
  const sheetName = `${m}月份`;
  const url = `https://docs.google.com/spreadsheets/d/${TRANSPORT_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
  try {
    const res = await fetch(url);
    const csv = await res.text();
    const rows = csvParse(csv);
    if (rows.length < 2) return [];
    const headers = rows[0];
    return rows.slice(1).map(row => {
      const obj = {};
      headers.forEach((h,i) => obj[h]=(row[i]||""));
      return obj;
    }).filter(r => r["日期"]);
  } catch { return []; }
}

async function loadData() {
  const now = new Date();
  const cur = now.getMonth()+1;
  const allMonths = [];
  for (let m = START_MONTH; m <= cur; m++) allMonths.push(m);
  months = allMonths.slice(-6).reverse();
  await Promise.all(months.map(async m => { allData[m] = await loadMonth(m); }));
  if (!months.length) { document.getElementById("main-content").innerHTML=`<div class="error">尚無記錄</div>`; return; }
  currentMonth = months[0];
  renderTabs(); renderPage();
}

function renderTabs() {
  document.getElementById("month-tabs").innerHTML = months.map(m =>
    `<div class="tab ${m===currentMonth?"active":""}" onclick="switchMonth(${m})">${m}月</div>`
  ).join("");
}

function switchMonth(m) { currentMonth=m; renderTabs(); renderPage(); }

function renderPage() {
  const records = allData[currentMonth]||[];
  const prev = currentMonth-1;
  const prevRec = allData[prev]||[];

  const total = records.reduce((s,r)=>s+parseInt(r["複價"]||0),0);
  const totalCars = records.reduce((s,r)=>s+parseFloat(r["車數"]||0),0);
  const avgPrice = records.length ? Math.round(total/records.length) : 0;
  const prevTotal = prevRec.reduce((s,r)=>s+parseInt(r["複價"]||0),0);
  const prevCars = prevRec.reduce((s,r)=>s+parseFloat(r["車數"]||0),0);
  const diff = prevTotal>0 ? Math.round((total-prevTotal)/prevTotal*100) : null;
  const diffText = diff!==null?(diff>0?`↑${diff}%`:`↓${Math.abs(diff)}%`):"－";
  const diffClass = diff!==null?(diff>0?"up":"down"):"";

  const compMap = {};
  records.forEach(r=>{ const c=r["清運地點或公司"]||"未知"; compMap[c]=(compMap[c]||0)+parseInt(r["複價"]||0); });
  const sortedComp = Object.entries(compMap).sort((a,b)=>b[1]-a[1]);
  const maxComp = sortedComp[0]?sortedComp[0][1]:1;

  const vtCars={}, vtAmt={};
  records.forEach(r=>{ const vt=r["車種"]||"一般"; vtCars[vt]=(vtCars[vt]||0)+parseFloat(r["車數"]||0); vtAmt[vt]=(vtAmt[vt]||0)+parseInt(r["複價"]||0); });

  const dayMap={};
  records.forEach(r=>{ const d=(r["日期"]||"").substring(5); dayMap[d]=(dayMap[d]||0)+parseInt(r["複價"]||0); });
  const dayKeys=Object.keys(dayMap).sort();

  const trend6=months.slice().reverse().map(m=>({
    label:m+"月",
    val:(allData[m]||[]).reduce((s,r)=>s+parseInt(r["複價"]||0),0),
    cars:(allData[m]||[]).reduce((s,r)=>s+parseFloat(r["車數"]||0),0)
  }));

  const badge=(i)=>i===0?"gold":i===1?"silver":i===2?"bronze":"";
  const fmtCar=(v)=>v%1===0?v:v.toFixed(1);

  document.getElementById("update-time").textContent=`更新：${new Date().toLocaleString("zh-TW")}`;
  document.getElementById("main-content").innerHTML=`
    <div class="stats">
      <div class="stat"><div class="stat-num">$${total.toLocaleString()}</div><div class="stat-lbl">${currentMonth}月營收</div></div>
      <div class="stat"><div class="stat-num ${diffClass}">${diffText}</div><div class="stat-lbl">較上月</div></div>
      <div class="stat"><div class="stat-num">${fmtCar(totalCars)}</div><div class="stat-lbl">本月車次</div></div>
      <div class="stat"><div class="stat-num">$${avgPrice.toLocaleString()}</div><div class="stat-lbl">平均單筆</div></div>
    </div>
    <div class="section"><h2>🏆 公司貢獻排行</h2>
      ${sortedComp.map(([comp,amt],i)=>{
        const w=Math.round(amt/maxComp*100);
        return `<div class="bar-row"><div class="rank-badge ${badge(i)}">${i+1}</div><div class="bar-label">${comp}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(w,5)}%;background:${COLORS[i%COLORS.length]}">$${amt.toLocaleString()}</div></div></div>`;
      }).join("")}
    </div>
    <div class="section"><h2>📅 每日營收趨勢</h2><div class="chart-wrap"><canvas id="dayChart"></canvas></div></div>
    <div class="section"><h2>🚛 車種分析</h2>
      <div class="vehicle-row">
        ${Object.entries(vtCars).map(([vt,cars],i)=>`<div class="vehicle-card"><div class="vehicle-num">${fmtCar(cars)}</div><div class="vehicle-lbl">${vt} 車次</div><div class="vehicle-amt">$${(vtAmt[vt]||0).toLocaleString()}</div></div>`).join("")}
      </div>
      <div style="margin-top:14px"><div class="chart-wrap"><canvas id="vtChart"></canvas></div></div>
    </div>
    <div class="section"><h2>📊 本月 vs 上月</h2>
      <div class="compare-item"><span>總營收</span><div style="display:flex;gap:20px"><div style="text-align:right"><div style="font-size:10px;color:#888">上月</div><div style="font-weight:600">$${prevTotal.toLocaleString()}</div></div><div style="text-align:right"><div style="font-size:10px;color:#888">本月</div><div style="font-weight:600;color:#5DCAA5">$${total.toLocaleString()}</div></div></div></div>
      <div class="compare-item"><span>總車次</span><div style="display:flex;gap:20px"><div style="text-align:right"><div style="font-size:10px;color:#888">上月</div><div style="font-weight:600">${fmtCar(prevCars)}</div></div><div style="text-align:right"><div style="font-size:10px;color:#888">本月</div><div style="font-weight:600;color:#5DCAA5">${fmtCar(totalCars)}</div></div></div></div>
    </div>
    <div class="section"><h2>📆 近6個月趨勢</h2><div class="chart-wrap tall"><canvas id="trend6Chart"></canvas></div></div>
  `;

  new Chart(document.getElementById("dayChart"),{type:"line",data:{labels:dayKeys,datasets:[{data:dayKeys.map(k=>dayMap[k]),borderColor:"#5DCAA5",backgroundColor:"rgba(93,202,165,0.1)",borderWidth:2,pointRadius:3,fill:true,tension:0.3}]},options:{plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>"$"+v.toLocaleString(),font:{size:10}}},x:{ticks:{font:{size:10},maxRotation:45}}},responsive:true,maintainAspectRatio:false}});

  const vtL=Object.keys(vtCars);
  new Chart(document.getElementById("vtChart"),{type:"doughnut",data:{labels:vtL,datasets:[{data:vtL.map(vt=>vtAmt[vt]||0),backgroundColor:COLORS.slice(0,vtL.length),borderWidth:0}]},options:{plugins:{legend:{position:"right",labels:{font:{size:12},padding:16}}},responsive:true,maintainAspectRatio:false}});

  new Chart(document.getElementById("trend6Chart"),{type:"bar",data:{labels:trend6.map(t=>t.label),datasets:[{label:"營收",data:trend6.map(t=>t.val),backgroundColor:trend6.map((_,i)=>i===trend6.length-1?"rgba(93,202,165,0.7)":"rgba(93,202,165,0.25)"),borderColor:trend6.map((_,i)=>i===trend6.length-1?"#5DCAA5":"#a8e6d4"),borderWidth:1,borderRadius:6,yAxisID:"y"},{label:"車次",data:trend6.map(t=>t.cars),type:"line",borderColor:"#7F77DD",backgroundColor:"rgba(127,119,221,0.15)",borderWidth:2,pointRadius:5,pointBackgroundColor:"#7F77DD",datalabels:{display:false},yAxisID:"y1"}]},options:{plugins:{legend:{labels:{font:{size:11}}},tooltip:{callbacks:{label:(ctx)=>ctx.dataset.label==="營收"?"$"+ctx.parsed.y.toLocaleString():ctx.parsed.y+"車"}}},scales:{y:{ticks:{callback:v=>"$"+v.toLocaleString(),font:{size:10}},position:"left",grid:{color:"rgba(0,0,0,0.05)"}},y1:{ticks:{callback:v=>v+"車",font:{size:10}},position:"right",grid:{drawOnChartArea:false}},x:{ticks:{font:{size:12}}}},responsive:true,maintainAspectRatio:false}});
}

loadData();
</script>
</body>
</html>
